# =============================================================================
# SEEDS — the ONLY hand-curated part of the system, and only a starting point.
# The pipeline grows far beyond this list on its own (see pipeline/discovery.py).
# You are encouraged to add sources here by hand too — but you never HAVE to.
# =============================================================================

# Tunables for the self-expanding behaviour.
settings:
  # How many *new* items to put in a daily digest.
  digest_size: 40
  # Co-citation: a candidate domain becomes a `trial` source once this many
  # DISTINCT active/seed sources have linked to it.
  promote_after_referrers: 2
  # Max new candidate domains to probe for a feed per run (keeps runs fast/polite).
  probe_budget: 12
  # A `trial` source needs this many items at/above avg to become `active`.
  trial_graduation_items: 3
  # A source whose rolling avg frontier-score falls below this gets retired.
  retire_below_avg: 0.28
  # A source needs at least this many observed items before it can be retired
  # (don't kill something just because it was quiet this week).
  retire_min_items: 8
  # epsilon-greedy exploration: fraction of the digest reserved for
  # deliberately under-explored sources (retired / low-data / random candidate).
  # This is what structurally prevents the source set from ossifying.
  explore_fraction: 0.15

  # --- ranking: distance (obscurity) vs. interest (worth) ---
  # Final rank = interest_weight * interest + (1-weight) * distance.
  # Interest is trusted more once the LLM has actually read the item.
  interest_weight_heuristic: 0.5   # when only the keyword heuristic scored it
  interest_weight_judged: 0.65     # when Claude read and scored it
  # Language you'd rather read. "ja" gives Japanese-language items a nudge and
  # (with an API key) every item gets a Japanese title + one-line summary.
  prefer_language: ja
  # How many heuristic-top items to send to the LLM judge each run (cost control).
  judge_shortlist: 80

# Always-on discovery aggregators. These are engines, not a fixed reading list:
# they surface items AND continuously spit out new candidate domains for the
# co-citation discovery to chew on. No API keys required.
discovery_sources:
  - {id: arxiv-cs-hc, kind: arxiv, query: "cat:cs.HC",  title: "arXiv · Human-Computer Interaction", tags: [research, tools-for-thought]}
  - {id: arxiv-cs-cy, kind: arxiv, query: "cat:cs.CY",  title: "arXiv · Computers & Society",         tags: [research, society]}
  - {id: hackernews,  kind: hn,                          title: "Hacker News (new, pre-viral)",         tags: [tech, frontier]}
  - {id: lobsters,    kind: rss, feed: "https://lobste.rs/rss", title: "Lobsters",                     tags: [tech, computing]}
  # Japanese discovery engines — the JP equivalents of HN. Their outbound links
  # auto-discover Japanese individual blogs via co-citation (so the source set
  # grows in Japanese too, not just English).
  - {id: hatena-it,   kind: rss, feed: "https://b.hatena.ne.jp/entrylist/it.rss",       title: "はてブ · テクノロジー新着", tags: [ja, tech]}
  - {id: hatena-know, kind: rss, feed: "https://b.hatena.ne.jp/entrylist/knowledge.rss", title: "はてブ · 学び新着",       tags: [ja, ideas]}
  - {id: anond,       kind: rss, feed: "https://anond.hatelabo.jp/rss",                  title: "はてな匿名ダイアリー（増田）", tags: [ja, raw]}

